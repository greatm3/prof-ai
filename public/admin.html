<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Prof · Admin</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #fff;
                --text: #0a0a0a;
                --dim: #5a5a5a;
                --muted: #9a9a9a;
                --grid: rgba(0, 0, 0, 0.05);
                --surface: #f4f4f4;
                --hover: #ececec;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                border-radius: 0 !important;
            }
            html,
            body {
                height: 100%;
            }
            body {
                font-family: "Inter", sans-serif;
                font-size: 13px;
                color: var(--text);
                background-color: var(--bg);
                background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                background-size: 46px 46px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                -webkit-font-smoothing: antialiased;
            }
            header {
                padding: 14px 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(6px);
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                font-size: 13px;
            }
            .brand .mark {
                width: 22px;
                height: 22px;
                background: #0a0a0a;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                font-weight: 700;
            }
            .stats {
                display: flex;
                gap: 22px;
                font-size: 12px;
                color: var(--dim);
            }
            .stats b {
                color: var(--text);
                font-weight: 600;
            }
            .stats .stat {
                cursor: default;
            }
            .refresh {
                font-size: 12px;
                color: var(--muted);
                cursor: pointer;
                user-select: none;
            }
            .refresh:hover {
                color: var(--text);
            }

            main {
                flex: 1;
                display: flex;
                overflow: hidden;
            }
            aside {
                width: 320px;
                overflow-y: auto;
                background: rgba(255, 255, 255, 0.92);
                border-right: 1px solid rgba(0, 0, 0, 0.04);
            }
            aside::-webkit-scrollbar {
                width: 6px;
            }
            aside::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.1);
            }

            .user-row {
                padding: 12px 18px;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                gap: 3px;
                transition: background 0.1s;
            }
            .user-row:hover {
                background: var(--hover);
            }
            .user-row.active {
                background: var(--surface);
            }
            .user-row .name {
                font-weight: 500;
                font-size: 13px;
            }
            .user-row .meta {
                font-size: 11px;
                color: var(--muted);
                display: flex;
                justify-content: space-between;
            }

            section {
                flex: 1;
                overflow-y: auto;
                padding: 20px 28px 40px;
            }
            section::-webkit-scrollbar {
                width: 6px;
            }
            section::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.1);
            }
            .empty {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--muted);
                font-size: 13px;
            }

            .detail-head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 4px;
                padding-bottom: 14px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            }
            .detail-head h2 {
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.3px;
            }
            .detail-head .id {
                font-size: 11px;
                color: var(--muted);
                font-family: ui-monospace, monospace;
            }

            .cards {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                margin: 18px 0 24px;
            }
            .card {
                background: var(--surface);
                padding: 12px 14px;
            }
            .card .label {
                font-size: 10px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 4px;
            }
            .card .value {
                font-size: 20px;
                font-weight: 700;
            }

            h3 {
                font-size: 11px;
                text-transform: uppercase;
                color: var(--dim);
                letter-spacing: 0.5px;
                font-weight: 600;
                margin: 22px 0 10px;
            }

            .topic-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 12px;
                background: #fafafa;
                margin-bottom: 4px;
                font-size: 12.5px;
            }
            .topic-row .pct {
                font-weight: 600;
                font-family: ui-monospace, monospace;
            }
            .topic-row.strong .pct {
                color: #0a7d2c;
            }
            .topic-row.weak .pct {
                color: #c0392b;
            }

            .session-row {
                display: grid;
                grid-template-columns: 1fr auto auto auto;
                gap: 12px;
                align-items: center;
                padding: 8px 12px;
                background: #fafafa;
                margin-bottom: 3px;
                font-size: 12px;
            }
            .session-row .type {
                font-weight: 500;
            }
            .session-row .topic {
                color: var(--dim);
            }
            .session-row .score {
                font-family: ui-monospace, monospace;
                font-weight: 600;
            }
            .session-row .time {
                color: var(--muted);
                font-size: 11px;
                min-width: 70px;
                text-align: right;
            }

            .msg {
                padding: 10px 12px;
                margin-bottom: 6px;
                background: #fafafa;
                font-size: 12.5px;
                line-height: 1.5;
            }
            .msg .head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 4px;
                font-size: 10.5px;
            }
            .msg .head .who {
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }
            .msg.user .head .who {
                color: #2a5db0;
            }
            .msg.assistant .head .who {
                color: #0a7d2c;
            }
            .msg .head .time {
                color: var(--muted);
            }
            .msg .body {
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            .msg .photo-tag {
                display: inline-block;
                font-size: 10px;
                background: #0a0a0a;
                color: #fff;
                padding: 1px 5px;
                margin-right: 6px;
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }

            .error-bar {
                padding: 10px 16px;
                background: #fee;
                color: #a00;
                font-size: 12px;
                display: none;
            }
            .error-bar.show {
                display: block;
            }

            .login {
                max-width: 320px;
                margin: 18vh auto;
                padding: 24px;
                background: #fff;
            }
            .login h2 {
                font-size: 15px;
                margin-bottom: 6px;
            }
            .login p {
                font-size: 12px;
                color: var(--dim);
                margin-bottom: 16px;
            }
            .login input {
                width: 100%;
                padding: 10px 12px;
                background: var(--surface);
                border: none;
                font-family: inherit;
                font-size: 13px;
                outline: none;
                margin-bottom: 10px;
            }
            .login button {
                width: 100%;
                padding: 10px;
                background: #0a0a0a;
                color: #fff;
                border: none;
                font-family: inherit;
                font-size: 13px;
                cursor: pointer;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div id="login" class="login">
            <h2>Prof · Admin</h2>
            <p>Enter your admin password.</p>
            <input type="password" id="pw" placeholder="Password" autofocus />
            <button id="loginBtn">Continue</button>
        </div>

        <div
            id="app"
            style="display: none; height: 100%; flex-direction: column"
        >
            <header>
                <div class="brand">
                    <div class="mark">P</div>
                    <span>Prof · Admin</span>
                </div>
                <div class="stats" id="stats"></div>
                <div class="refresh" onclick="reload()">↻ refresh</div>
            </header>
            <div class="error-bar" id="error-bar"></div>
            <main>
                <aside id="user-list"></aside>
                <section id="detail">
                    <div class="empty">
                        Select a user to view their profile.
                    </div>
                </section>
            </main>
        </div>

        <script>
            const params = new URLSearchParams(location.search);
            let token =
                params.get("token") || localStorage.getItem("prof_token") || "";
            let activeUserId = null;

            const $ = (id) => document.getElementById(id);

            async function api(path, retries = 2) {
                const sep = path.includes("?") ? "&" : "?";
                const url = path + sep + "token=" + encodeURIComponent(token);
                let lastErr;
                for (let i = 0; i <= retries; i++) {
                    try {
                        const res = await fetch(url, { cache: "no-store" });
                        if (!res.ok) {
                            const text = await res.text().catch(() => "");
                            throw new Error(
                                `HTTP ${res.status} ${text.slice(0, 200)}`,
                            );
                        }
                        const text = await res.text();
                        if (!text) throw new Error("empty response body");
                        try {
                            return JSON.parse(text);
                        } catch (parseErr) {
                            console.error(
                                "[admin] JSON parse failed. Raw body (first 500 chars):",
                                text.slice(0, 500),
                            );
                            throw new Error(
                                "invalid JSON: " + parseErr.message,
                            );
                        }
                    } catch (err) {
                        lastErr = err;
                        console.warn(
                            `[admin] ${path} attempt ${i + 1}/${retries + 1} failed:`,
                            err.message,
                        );
                        if (i < retries)
                            await new Promise((r) =>
                                setTimeout(r, 500 * (i + 1)),
                            );
                    }
                }
                throw lastErr;
            }

            function fmtTime(ts) {
                if (!ts) return "—";
                const diff = Date.now() - ts;
                if (diff < 60_000) return "just now";
                if (diff < 3_600_000)
                    return Math.floor(diff / 60_000) + "m ago";
                if (diff < 86_400_000)
                    return Math.floor(diff / 3_600_000) + "h ago";
                if (diff < 7 * 86_400_000)
                    return Math.floor(diff / 86_400_000) + "d ago";
                return new Date(ts).toLocaleDateString();
            }

            function fmtDate(ts) {
                if (!ts) return "—";
                return new Date(ts).toLocaleString([], {
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                });
            }

            function esc(s) {
                return String(s ?? "").replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );
            }

            function userDisplay(u) {
                if (!u) return "Unknown";
                if (u.username) return "@" + u.username;
                if (u.first_name) return u.first_name;
                return "User " + (u.user_id ?? "?");
            }

            function showError(msg) {
                const bar = $("error-bar");
                bar.textContent = msg;
                bar.classList.add("show");
            }
            function clearError() {
                $("error-bar").classList.remove("show");
            }

            async function loadStats() {
                try {
                    const s = await api("/api/stats");
                    $("stats").innerHTML = `
        <div class="stat"><b>${s.users}</b> users</div>
        <div class="stat"><b>${s.active_24h}</b> active</div>
        <div class="stat"><b>${s.sessions}</b> sessions</div>
        <div class="stat"><b>${s.answers}</b> answers</div>
        <div class="stat"><b>${s.messages}</b> messages</div>
      `;
                } catch (err) {
                    showError("Stats failed: " + err.message);
                }
            }

            async function loadUserList() {
                try {
                    const users = await api("/api/users");
                    if (!Array.isArray(users)) {
                        console.error(
                            "[admin] /api/users did not return array:",
                            users,
                        );
                        throw new Error("expected array, got " + typeof users);
                    }
                    const list = $("user-list");
                    list.innerHTML = "";
                    if (!users.length) {
                        list.innerHTML =
                            '<div class="empty" style="padding:30px; font-size:12px;">No users yet.</div>';
                        return;
                    }
                    for (const u of users) {
                        const row = document.createElement("div");
                        row.className =
                            "user-row" +
                            (u.user_id === activeUserId ? " active" : "");
                        row.innerHTML = `
          <div class="name">${esc(userDisplay(u))}</div>
          <div class="meta">
            <span>${u.answers ?? 0} answers · ${u.sessions ?? 0} sessions</span>
            <span>${fmtTime(u.last_seen)}</span>
          </div>
        `;
                        row.addEventListener("click", () =>
                            openUser(u.user_id),
                        );
                        list.appendChild(row);
                    }
                } catch (err) {
                    showError("Users failed: " + err.message);
                    console.error("[admin] loadUserList failed:", err);
                }
            }

            async function openUser(userId) {
                activeUserId = userId;
                document
                    .querySelectorAll(".user-row")
                    .forEach((el) => el.classList.remove("active"));
                await loadUserList();
                const detail = $("detail");
                detail.innerHTML = '<div class="empty">Loading…</div>';
                try {
                    const d = await api("/api/user/" + userId);
                    renderDetail(d);
                } catch (err) {
                    detail.innerHTML = `<div class="empty">Failed to load user: ${esc(err.message)}</div>`;
                    console.error("[admin] openUser failed:", err);
                }
            }

            function renderDetail(d) {
                const { user, stats, topics, sessions, messages } = d;
                const detail = $("detail");
                const strong = topics.filter(
                    (t) => t.accuracy >= 80 && t.total >= 3,
                );
                const weak = topics.filter(
                    (t) => t.accuracy < 60 && t.total >= 3,
                );

                detail.innerHTML = `
      <div class="detail-head">
        <h2>${esc(userDisplay(user))}</h2>
        <div class="id">id: ${user.user_id} · first seen ${fmtDate(user.first_seen)} · last seen ${fmtTime(user.last_seen)}</div>
      </div>
      <div class="cards">
        <div class="card"><div class="label">Accuracy</div><div class="value">${stats.accuracy}%</div></div>
        <div class="card"><div class="label">Answers</div><div class="value">${stats.total_answers}</div></div>
        <div class="card"><div class="label">Correct</div><div class="value">${stats.total_correct}</div></div>
        <div class="card"><div class="label">Sessions</div><div class="value">${stats.sessions}</div></div>
      </div>
      ${
          strong.length
              ? `<h3>Strong areas</h3>${strong
                    .map(
                        (t) => `
        <div class="topic-row strong"><span>${esc(t.topic)} <span style="color:#9a9a9a">(${t.total} q)</span></span><span class="pct">${t.accuracy}%</span></div>`,
                    )
                    .join("")}`
              : ""
      }
      ${
          weak.length
              ? `<h3>Weak areas</h3>${weak
                    .map(
                        (t) => `
        <div class="topic-row weak"><span>${esc(t.topic)} <span style="color:#9a9a9a">(${t.total} q)</span></span><span class="pct">${t.accuracy}%</span></div>`,
                    )
                    .join("")}`
              : ""
      }
      ${
          topics.length && !strong.length && !weak.length
              ? `<h3>Topics</h3>${topics
                    .map(
                        (t) => `
        <div class="topic-row"><span>${esc(t.topic)} <span style="color:#9a9a9a">(${t.total} q)</span></span><span class="pct">${t.accuracy}%</span></div>`,
                    )
                    .join("")}`
              : ""
      }
      <h3>Sessions (${sessions.length})</h3>
      ${
          sessions.length
              ? sessions
                    .map(
                        (s) => `
        <div class="session-row"><span class="type">${esc(s.type)}</span><span class="topic">${esc(s.topic || "—")}</span><span class="score">${s.score ?? "—"}/${s.total_questions ?? "—"}</span><span class="time">${fmtTime(s.completed_at)}</span></div>`,
                    )
                    .join("")
              : '<div style="padding:10px; color:#9a9a9a; font-size:12px;">No sessions yet.</div>'
      }
      <h3>Chat history (last ${Math.min(messages.length, 100)})</h3>
      ${
          messages.length
              ? messages
                    .map(
                        (m) => `
        <div class="msg ${m.role}"><div class="head"><span class="who">${m.role === "user" ? "User" : "Prof"}</span><span class="time">${fmtDate(m.created_at)}</span></div><div class="body">${m.has_photo ? '<span class="photo-tag">photo</span>' : ""}${esc(m.content || "")}</div></div>`,
                    )
                    .join("")
              : '<div style="padding:10px; color:#9a9a9a; font-size:12px;">No messages yet.</div>'
      }
    `;
            }

            async function reload() {
                clearError();
                await loadStats();
                await loadUserList();
                if (activeUserId) await openUser(activeUserId);
            }

            async function boot() {
                if (!token) return;
                try {
                    await api("/api/stats");
                    localStorage.setItem("prof_token", token);
                    $("login").style.display = "none";
                    const app = $("app");
                    app.style.display = "flex";
                    app.style.flexDirection = "column";
                    await reload();
                    setInterval(loadStats, 15000);
                } catch {
                    localStorage.removeItem("prof_token");
                    $("login").style.display = "block";
                    $("app").style.display = "none";
                }
            }

            $("loginBtn").addEventListener("click", () => {
                token = $("pw").value.trim();
                if (token) boot();
            });
            $("pw").addEventListener("keydown", (e) => {
                if (e.key === "Enter") $("loginBtn").click();
            });

            boot();
        </script>
    </body>
</html>
